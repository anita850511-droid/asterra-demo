<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#171a1f" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Asterra · v4.6.1 即時角色預覽修正版</title>
  <link rel="stylesheet" href="styles-v461.css?v=461" />
</head>
<body>
<div id="app" class="app-shell">
  <div class="bg"></div>
  <header class="brand-block">
    <div class="brand-mark">✦</div>
    <div>
      <h1>ASTERRA</h1>
      <div class="creator-label">角色建立 <span>CHARACTER CREATOR · v4.6.1 LIVE PREVIEW FIX</span></div>
    </div>
  </header>

  <main class="creator-layout">
    <nav id="categoryNav" class="category-nav" aria-label="角色調整分類"></nav>

    <section class="preview-zone">
      <div class="preview-card">
        <div class="preview-toolbar">
          <span id="cameraLabel">正面 · 臉部</span>
          <div class="toolbar-actions">
            <button id="undoBtn" title="撤銷">↶</button>
            <button id="redoBtn" title="重做">↷</button>
          </div>
        </div>
        <div id="portraitViewport" class="portrait-viewport">
          <canvas id="avatarCanvas" aria-label="角色即時預覽"></canvas>
          <div class="preview-vignette"></div>
          <div id="previewHint" class="preview-hint">拖動右側參數會直接改變角色預覽。此版使用即時影像變形驗證捏角手感；正式版會改由可動畫的 3D 角色模型承接相同參數。</div>
        </div>
        <div class="preview-footer">
          <div><small>目前狀態</small><b id="activeSummary">臉型 01</b></div>
          <div class="camera-switch">
            <button data-camera="face" class="active">臉部</button>
            <button data-camera="body">全身</button>
          </div>
        </div>
      </div>
    </section>

    <aside class="control-panel">
      <div class="control-head">
        <div><small>APPEARANCE</small><h2 id="panelTitle">臉型</h2></div>
        <div id="counterLabel" class="counter">01 / 12</div>
      </div>
      <div id="controlContent" class="control-content"></div>
      <div class="control-bottom">
        <div class="utility-row">
          <button id="randomBtn" class="subtle">隨機生成</button>
          <button id="resetBtn" class="subtle">重置全部</button>
        </div>
        <button id="saveBtn" class="primary">儲存角色外觀</button>
      </div>
    </aside>
  </main>

  <div id="saveSheet" class="save-sheet hidden">
    <div class="save-card">
      <small>CHARACTER RECIPE SAVED</small>
      <h2>外觀參數已儲存</h2>
      <p>這個測試版會把角色設定保存在目前瀏覽器。姓名、生日仍留到市政廳居民登記時輸入。</p>
      <pre id="recipePreview"></pre>
      <div class="save-actions">
        <button id="continueEditing" class="subtle">繼續調整</button>
        <button id="confirmSave" class="primary">完成</button>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
</div>
<script src="app-v461.js?v=461"></script>
</body>
</html>
